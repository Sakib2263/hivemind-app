<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="title desc" font-family="Inter,Segoe UI,Arial,sans-serif">
<title id="title">Work capacity per month vs Claude and Codex alone</title><desc id="desc">Indexed monthly capacity: Claude and Codex alone 100 percent, Hivemind jobs passed 139 percent, tokens processed 213 percent.</desc>
<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#171b27"/><stop offset="1" stop-color="#11151e"/></linearGradient><linearGradient id="g1"><stop stop-color="#6489eb"/><stop offset="1" stop-color="#8faaff"/></linearGradient><linearGradient id="g2"><stop stop-color="#37b88e"/><stop offset="1" stop-color="#72dfb2"/></linearGradient><linearGradient id="g3"><stop stop-color="#9a76e9"/><stop offset="1" stop-color="#c0a4ff"/></linearGradient></defs>
<rect width="960" height="340" rx="24" fill="url(#bg)"/><rect x="1" y="1" width="958" height="338" rx="23" fill="none" stroke="#2c3444"/>
<text x="36" y="43" fill="#f3f5fb" font-size="21" font-weight="700">Work capacity per month vs Claude + Codex alone</text><text x="36" y="68" fill="#9aa6ba" font-size="12.5">Measured 27 Oct - 19 Nov 2026 on one PC, projected to 30 days. Range +40% to +110%.</text>
<g stroke="#293243" stroke-width="1"><path d="M308 95v195"/><path d="M428 95v195"/><path d="M548 95v195"/><path d="M668 95v195"/><path d="M788 95v195"/></g>
<g fill="#8793a8" font-size="10" text-anchor="middle"><text x="308" y="306">0</text><text x="414.7" y="306">50</text><text x="521.3" y="306">100</text><text x="628" y="306">150</text><text x="734.7" y="306">200</text></g>
<g fill="#e3e8f2" font-size="13" font-weight="600"><text x="36" y="126">Claude + Codex only</text><text x="36" y="190">With Hivemind: jobs passed</text><text x="36" y="254">With Hivemind: tokens processed</text></g>
<g><rect x="308" y="105" width="480" height="28" rx="8" fill="#222a38"/><rect x="308" y="105" width="1" height="28" rx="1" fill="url(#g1)"><animate attributeName="width" from="0" to="213.3" dur="1.15s" fill="freeze"/></rect><text x="530" y="125" fill="#cbd6ee" font-size="13" font-weight="700">100%</text></g>
<g><rect x="308" y="169" width="480" height="28" rx="8" fill="#222a38"/><rect x="308" y="169" width="1" height="28" rx="1" fill="url(#g2)"><animate attributeName="width" from="0" to="296.5" dur="1.35s" fill="freeze"/></rect><text x="613" y="189" fill="#8fe3be" font-size="13" font-weight="700">139% <tspan fill="#a4b0c4" font-size="11">(+39%)</tspan></text></g>
<g><rect x="308" y="233" width="480" height="28" rx="8" fill="#222a38"/><rect x="308" y="233" width="1" height="28" rx="8" fill="url(#g3)"><animate attributeName="width" from="0" to="454.4" dur="1.55s" fill="freeze"/></rect><text x="766" y="253" fill="#d5c5ff" font-size="13" font-weight="700">213% <tspan fill="#b9accf" font-size="11">(+113%)</tspan></text></g>
</svg>
