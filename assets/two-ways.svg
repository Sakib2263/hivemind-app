<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" role="img" aria-labelledby="title desc" font-family="Inter,Segoe UI,Arial,sans-serif">
<title id="title">Two ways to use Hivemind</title><desc id="desc">Use Claude or Codex as your lead, or manage everything in Hivemind. Both use the same workers and checks.</desc>
<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#171b27"/><stop offset="1" stop-color="#11151e"/></linearGradient></defs>
<rect width="960" height="370" rx="24" fill="url(#bg)"/><rect x="1" y="1" width="958" height="368" rx="23" fill="none" stroke="#2c3444"/>
<g>
 <rect x="24" y="24" width="444" height="262" rx="18" fill="#1a202c" stroke="#3a4559"/><rect x="492" y="24" width="444" height="262" rx="18" fill="#1a202c" stroke="#3a4559"/>
 <text x="48" y="59" fill="#f4f6fc" font-size="19" font-weight="700">Use your AI app</text><text x="516" y="59" fill="#f4f6fc" font-size="19" font-weight="700">Use Hivemind alone</text>
 <!-- left icon: chat window -->
 <rect x="48" y="78" width="64" height="58" rx="10" fill="#242b3b" stroke="#819cff"/><path d="M61 92h37M61 101h25M61 110h31" stroke="#a9bbff" stroke-width="3" stroke-linecap="round"/><circle cx="100" cy="124" r="3" fill="#7f9dff"/>
 <text x="128" y="96" fill="#e7ebf5" font-size="13" font-weight="600">Claude desktop / Claude Code</text><text x="128" y="116" fill="#e7ebf5" font-size="13" font-weight="600">or Codex desktop is the lead</text>
 <path d="M80 143v20h165" fill="none" stroke="#71809a" stroke-width="2"/><path d="M245 163v10" stroke="#71809a" stroke-width="2"/>
 <rect x="48" y="174" width="398" height="95" rx="13" fill="#202b32" stroke="#456e66"/>
 <circle cx="73" cy="202" r="12" fill="#27453d"/><path d="M67 202h12M73 196v12" stroke="#8be0bf" stroke-width="2" stroke-linecap="round"/>
 <text x="96" y="199" fill="#dff8ee" font-size="13" font-weight="650">Hivemind runs workers in the background</text><text x="96" y="220" fill="#a9c4bd" font-size="12">Tracks usage and limits, then sends notes</text><text x="96" y="239" fill="#a9c4bd" font-size="12">when work passes or needs your attention.</text>
 <!-- right icon: app window -->
 <rect x="516" y="78" width="64" height="58" rx="10" fill="#242b3b" stroke="#bd9cff"/><rect x="523" y="85" width="50" height="8" rx="4" fill="#342d47"/><circle cx="529" cy="89" r="1.5" fill="#c7a7ff"/><path d="M527 101h19v25h-19zM551 102h17M551 109h17M551 116h12" fill="none" stroke="#c8b4f2" stroke-width="2" stroke-linecap="round"/>
 <text x="596" y="96" fill="#e7ebf5" font-size="13" font-weight="600">Everything in one Hivemind window</text><text x="596" y="116" fill="#b7c0d1" font-size="12">Chat · projects · jobs · sign-ins</text>
 <path d="M548 143v20h165" fill="none" stroke="#71809a" stroke-width="2"/><path d="M713 163v10" stroke="#71809a" stroke-width="2"/>
 <rect x="516" y="174" width="398" height="95" rx="13" fill="#262336" stroke="#625582"/>
 <circle cx="541" cy="202" r="12" fill="#3c3455"/><path d="M536 202h10M541 197v10" stroke="#c4aaff" stroke-width="2" stroke-linecap="round"/>
 <text x="564" y="199" fill="#eee6ff" font-size="13" font-weight="650">Set API keys on the AI models screen</text><text x="564" y="220" fill="#c1b8d8" font-size="12">Hivemind finds available models and starts</text><text x="564" y="239" fill="#c1b8d8" font-size="12">using them for work in your projects.</text>
</g>
<!-- shared ending -->
<path d="M246 287v15h234M714 287v15H480" fill="none" stroke="#536177" stroke-width="2"/><rect x="280" y="299" width="400" height="48" rx="16" fill="#202c32" stroke="#56cba5" stroke-width="1.4"/><text x="480" y="329" text-anchor="middle" fill="#e4fff4" font-size="16" font-weight="700">Workers + checks</text>
</svg>
